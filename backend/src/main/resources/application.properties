# ============================================================
#  FinTrack — Application Configuration
#  File: src/main/resources/application.properties
# ============================================================

# ── Server ──────────────────────────────────────────────────
server.port=8080

# ── SQLite Database ─────────────────────────────────────────
# Database file will be created in project root as fintrack.db
spring.datasource.url=jdbc:sqlite:./fintrack.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=

# ── Hibernate / JPA ─────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
# update = schema auto-update on startup (use validate in production)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ── JWT ─────────────────────────────────────────────────────
# IMPORTANT: Replace with a strong random secret in production (min 256-bit)
app.jwt.secret=FinTrack_Super_Secret_Key_Change_This_In_Production_Min32Chars!
# Token expiry: 7 days in milliseconds
app.jwt.expiration=604800000

# ── Google OAuth2 ───────────────────────────────────────────
# Replace with your actual Google OAuth2 credentials from Google Cloud Console
spring.security.oauth2.client.registration.google.client-id=YOUR_GOOGLE_CLIENT_ID
spring.security.oauth2.client.registration.google.client-secret=YOUR_GOOGLE_CLIENT_SECRET
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/api/auth/oauth2/callback/google

# ── CORS ────────────────────────────────────────────────────
# Frontend dev server URL — change for production
app.cors.allowed-origins=http://localhost:5173

# ── Frontend redirect after OAuth2 login ────────────────────
app.oauth2.redirect-uri=http://localhost:5173/oauth2/callback

# ── Logging ─────────────────────────────────────────────────
logging.level.com.fintrack=DEBUG
logging.level.org.springframework.security=WARN
